[program:tofino_model]
command=/bin/bash -c "source /etc/default/bf-sde && setup_ports.sh $ARCH $PORTS_FILE && exec run_tofino_model.sh $MODEL_ARGS"
user=root
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/tofino_model.log
redirect_stderr=true
#stderr_logfile=/var/log/tofino_model-err.log

[program:bf_switchd]
command=/bin/bash -c "source /etc/default/bf-sde && sleep 5 && exec run_switchd.sh $BF_ARGS"
directory=/opt/bf-sde
user=root
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/bf_switchd.log
redirect_stderr=true
#stderr_logfile=/var/log/bf_switchd-err.log

[program:pd_rpc]
command=/bin/bash -c "wait-tofino.sh && exec run_pd_rpc.py --thrift-ip 127.0.0.1 --skip-pipeline-bind --target-type asic-model --only-flask"
user=root
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/pd_rpc.log
redirect_stderr=true
#stderr_logfile=/var/log/pd_rpc-err.log

[program:monitor_ports]
command=/bin/bash -c "wait-tofino.sh && exec monitor_ports.py /tmp/ports.json"
user=root
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/monitor_ports.log
redirect_stderr=true
#stderr_logfile=/var/log/monitor_ports-err.log
